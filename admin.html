<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>CLICK DESIGN | 관리자 대시보드</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body class="admin-page">

    <!-- 1. GitHub API Authentication Overlay -->
    <div id="admin-login-overlay" class="admin-login-wrapper">
        <div class="login-card" style="max-width: 480px;">
            <div class="login-icon-box" style="background: rgba(255, 80, 0, 0.1); color: var(--accent);">
                <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M9 19c-5 1.5-5-2.5-7-3m14 6v-3.87a3.37 3.37 0 0 0-.94-2.61c3.14-.35 6.44-1.54 6.44-7A5.44 5.44 0 0 0 20 4.77 5.07 5.07 0 0 0 19.91 1S18.73.65 16 2.48a13.38 13.38 0 0 0-7 0C6.27.65 5.09 1 5.09 1A5.07 5.07 0 0 0 5 4.77a5.44 5.44 0 0 0-1.5 3.78c0 5.42 3.3 6.61 6.44 7A3.37 3.37 0 0 0 9 18.13V22"></path>
                </svg>
            </div>
            <h1 class="login-title">GitHub CMS Login</h1>
            <p class="login-desc" style="margin-bottom: 25px;">포트폴리오 즉시 반영을 위해 깃허브 계정 정보를 입력하세요.</p>
            
            <form id="admin-login-form" class="login-form">
                <!-- GitHub Personal Access Token -->
                <div class="form-group floating-group">
                    <input type="password" id="github-token-input" required placeholder=" " autocomplete="current-password">
                    <label for="github-token-input">GitHub Personal Access Token (비밀키)</label>
                </div>
                <!-- GitHub Repo Owner/Name -->
                <div class="form-group floating-group" style="margin-top: 15px;">
                    <input type="text" id="github-repo-input" required placeholder=" " autocomplete="off">
                    <label for="github-repo-input">GitHub 저장소 경로 (예: 사용자명/저장소명)</label>
                </div>
                <!-- GitHub Branch Name -->
                <div class="form-group floating-group" style="margin-top: 15px;">
                    <input type="text" id="github-branch-input" required placeholder=" " autocomplete="off" value="main">
                    <label for="github-branch-input">브랜치명 (예: main 또는 master)</label>
                </div>
                
                <div id="login-error-msg" class="login-feedback" style="margin-top: 15px;"></div>
                
                <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 20px;">연동 및 로그인</button>
            </form>
        </div>
    </div>

    <!-- 2. Admin Dashboard Layout (Initially Hidden) -->
    <div id="admin-dashboard-view" class="admin-dashboard" style="display: none;">
        
        <!-- Header -->
        <header class="admin-header">
            <div class="admin-header-container">
                <div class="admin-title-area">
                    <a href="index.html" class="logo" style="cursor: pointer;">
                        <svg class="logo-icon" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path>
                            <polyline points="3.27 6.96 12 12.01 20.73 6.96"></polyline>
                            <line x1="12" y1="22.08" x2="12" y2="12"></line>
                        </svg>
                        <span class="logo-text"><span class="logo-accent">CLICK</span> DESIGN</span>
                    </a>
                    <span class="admin-badge">ADMIN (GitHub CMS)</span>
                </div>
                <div class="admin-nav-actions">
                    <a href="index.html" class="btn btn-secondary" style="padding: 8px 18px; font-size: 0.8rem;">웹사이트 보기</a>
                    <button id="admin-logout-btn" class="btn btn-secondary" style="padding: 8px 18px; font-size: 0.8rem; border-color: rgba(255, 100, 100, 0.3); color: hsl(0, 80%, 70%);">연동 해제 (로그아웃)</button>
                </div>
            </div>
        </header>

        <!-- Main Body -->
        <main class="container">
            
            <!-- Statistics Overview Cards -->
            <div class="stats-grid">
                <div class="stats-card">
                    <span class="stats-label">총 프로젝트 수</span>
                    <span class="stats-value" id="stats-total">0</span>
                </div>
                <div class="stats-card">
                    <span class="stats-label">조감도</span>
                    <span class="stats-value" id="stats-birds-eye">0</span>
                </div>
                <div class="stats-card">
                    <span class="stats-label">투시도</span>
                    <span class="stats-value" id="stats-perspective">0</span>
                </div>
                <div class="stats-card">
                    <span class="stats-label">인테리어</span>
                    <span class="stats-value" id="stats-interior">0</span>
                </div>
                <div class="stats-card">
                    <span class="stats-label">시뮬레이션</span>
                    <span class="stats-value" id="stats-simulation">0</span>
                </div>
            </div>

            <!-- Action Bar & Controls -->
            <div class="dashboard-action-bar">
                <h2 class="action-bar-title">
                    프로젝트 목록 관리
                    <span id="project-count-summary">(총 0개 등록됨)</span>
                </h2>
                <button id="btn-add-project" class="btn btn-primary">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="margin-right: 4px;"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
                    <span>새 프로젝트 추가</span>
                </button>
            </div>

            <!-- Projects Management Table -->
            <div class="table-responsive">
                <table class="admin-table">
                    <thead>
                        <tr>
                            <th style="width: 120px;">썸네일</th>
                            <th>프로젝트명</th>
                            <th style="width: 140px;">카테고리</th>
                            <th style="width: 140px;">제작 연월</th>
                            <th style="width: 180px; text-align: center;">작업 관리</th>
                        </tr>
                    </thead>
                    <tbody id="table-body-projects">
                        <!-- Dynamic content injected via JS -->
                    </tbody>
                </table>
            </div>

            <!-- Hero Slider Management Section -->
            <section class="slider-management-section" style="margin-top: 60px;">
                <div class="dashboard-action-bar">
                    <h2 class="action-bar-title">
                        메인 슬라이드 관리
                        <span>(히어로 영역 배경 이미지 설정)</span>
                    </h2>
                    <button id="btn-add-slide" class="btn btn-primary">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="margin-right: 4px;"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
                        <span>새 슬라이드 추가</span>
                    </button>
                </div>
                
                <div class="slides-admin-grid" id="slides-admin-grid">
                    <!-- Dynamic slide management cards injected via JS -->
                </div>
                
                <div class="form-actions-row" style="margin-top: 30px; justify-content: flex-start;">
                    <button type="button" id="btn-save-slides" class="btn btn-primary">슬라이드 설정 저장</button>
                </div>
            </section>

        </main>
    </div>

    <!-- 3. Form Modal (Add / Edit Project) -->
    <div id="project-form-modal" class="project-modal" aria-hidden="true" role="dialog">
        <div class="modal-backdrop" id="form-modal-close-backdrop"></div>
        <div class="modal-content-wrapper form-modal-wrapper">
            <button id="form-modal-close-btn" class="modal-close-btn" aria-label="모달 닫기">&times;</button>
            <div class="modal-form-container">
                <h2 id="form-modal-title">새 프로젝트 추가</h2>
                <div class="modal-divider"></div>
                
                <form id="portfolio-project-form" class="contact-form project-form">
                    <input type="hidden" id="form-project-id" name="id">
                    
                    <div class="form-row">
                        <div class="form-group floating-group">
                            <input type="text" id="form-title" name="title" required placeholder=" " autocomplete="off">
                            <label for="form-title">프로젝트명</label>
                        </div>
                        <div class="form-group floating-group">
                            <select id="form-category" name="category" required>
                                <option value="" disabled selected hidden></option>
                                <option value="birds-eye">조감도</option>
                                <option value="perspective">투시도</option>
                                <option value="interior">인테리어</option>
                                <option value="simulation">시뮬레이션</option>
                            </select>
                            <label for="form-category" class="select-label">카테고리</label>
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-group floating-group">
                            <input type="text" id="form-date" name="date" required placeholder=" " autocomplete="off">
                            <label for="form-date">제작 일자 (예: 2026년 06월)</label>
                        </div>
                    </div>

                    <!-- Image URL or File Upload -->
                    <div class="form-row file-upload-row">
                        <div class="form-group floating-group">
                            <input type="text" id="form-img-url" name="imgUrl" placeholder=" " autocomplete="off">
                            <label for="form-img-url">이미지 경로 (예: assets/birds_eye_view.png)</label>
                        </div>
                        <div class="form-group file-group">
                            <label class="file-label-btn" for="form-file-input">
                                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                                    <polyline points="17 8 12 3 7 8"></polyline>
                                    <line x1="12" y1="3" x2="12" y2="15"></line>
                                </svg>
                                <span>이미지 파일 업로드</span>
                            </label>
                            <input type="file" id="form-file-input" accept="image/*" style="display: none;">
                            <span id="file-name-display" class="file-name-display">선택된 파일 없음</span>
                        </div>
                    </div>
                    
                    <!-- Preview Image -->
                    <div class="form-group image-preview-group">
                        <span class="preview-title">이미지 미리보기</span>
                        <div class="image-preview-box">
                            <img id="form-image-preview" src="" alt="미리보기">
                        </div>
                    </div>

                    <div class="form-actions-row">
                        <button type="submit" id="save-project-btn" class="btn btn-primary">저장하기</button>
                        <button type="button" id="cancel-project-btn" class="btn btn-secondary">취소</button>
                    </div>
                </form>
                
            </div>
        </div>
    </div>

    <script type="module" src="admin.js"></script>
</body>
</html>
